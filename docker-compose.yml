version: '3.9'

services:
  web:
    build: .
    container_name: chatbot_web
    volumes:
      - .:/djangoProjectChatBot
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: chatbot_db
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbotuser
      POSTGRES_PASSWORD: chatbotpass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chatbot_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
